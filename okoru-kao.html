<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>怒る顔</title>
<style>
  :root {
    --bg: #1c1c1c;
    --panel: #ffffff;
    --cols: 5;
    --rows: 5;
    --gap: 6px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
  }

  img { -webkit-user-drag: none; pointer-events: none; }

  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ===== ヘッダー ===== */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
    position: relative;
  }

  .hbtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.85);
    background: transparent;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    touch-action: manipulation;
  }
  .hbtn:active { background: rgba(255,255,255,0.12); }

  .title {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    pointer-events: none;
  }
  #app.state-result .title { opacity: 0; }

  .hright { display: flex; align-items: center; gap: 10px; }

  .noads {
    height: 44px;
    padding: 0 16px;
    border-radius: 22px;
    border: 2px solid rgba(255,255,255,0.85);
    background: transparent;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  /* リトライは結果画面のときだけ中央に表示 */
  .retry-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #app.state-result .retry-btn {
    opacity: 1;
    pointer-events: auto;
  }
  #app.state-result .noads { opacity: 0.4; }

  /* ===== プレイフィールド ===== */
  #field-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 16px 18px;
    min-height: 0;
  }

  #panel {
    position: relative;
    background: var(--panel);
    border-radius: 22px;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-template-rows: repeat(var(--rows), 1fr);
    gap: var(--gap);
    padding: var(--gap);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .cell {
    position: relative;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f1f1f1;
  }

  .face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    will-change: transform, filter, opacity;
    transform-origin: center center;
    border-radius: 50%;
  }

  /* 押下中：暗転（当たりでも同じ見た目） */
  .cell.pressing { background: #d9d9d9; }
  .cell.pressing .face {
    filter: brightness(0.5);
    transform: scale(0.92);
    transition: transform 0.08s ease;
  }

  .cell.empty { pointer-events: none; background: transparent; }
  .cell.empty .face { display: none; }

  /* セーフ：跳ねて上へ飛ぶ */
  @keyframes fly-away {
    0%   { transform: translateY(0) scale(1); }
    18%  { transform: translateY(8%) scale(1.08, 0.9); }
    40%  { transform: translateY(-6%) scale(0.96, 1.06); }
    100% { transform: translateY(-170%) scale(0.6) rotate(20deg); opacity: 0; }
  }
  .cell.flying { background: transparent; }
  .cell.flying .face {
    animation: fly-away 0.42s cubic-bezier(0.4, 0, 0.9, 0.4) forwards;
  }

  /* 怒り：溜め→ブルブル震え */
  @keyframes shake {
    0%,100% { transform: translateX(0) translateY(0) rotate(0deg) scale(1.15); }
    15% { transform: translateX(-4px) rotate(-3deg) scale(1.15); }
    30% { transform: translateX(4px) rotate(3deg) scale(1.15); }
    45% { transform: translateX(-4px) rotate(-3deg) scale(1.15); }
    60% { transform: translateX(4px) rotate(3deg) scale(1.15); }
    75% { transform: translateX(-3px) rotate(-2deg) scale(1.15); }
  }

  .cell.angry {
    z-index: 50;
    overflow: visible;
    background: transparent;
  }
  .cell.angry .face {
    filter: none;
  }
  .cell.angry.shaking .face {
    animation: shake 0.42s ease-in-out 1;
  }

  /* 他の顔のフェードアウト（ズーム演出時） */
  .cell.fade .face {
    transition: opacity 0.3s ease;
    opacity: 0;
  }

  /* ===== 結果：怒り顔をパネルいっぱいにズーム表示 ===== */
  #result-layer {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
  }
  #app.state-angry #result-layer,
  #app.state-result #result-layer { display: flex; }

  @keyframes zoom-in {
    0%   { transform: scale(0.25); opacity: 0.6; }
    70%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes prunprun {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50%     { transform: scale(1.03) rotate(2deg); }
  }

  #result-img {
    max-width: 92%;
    max-height: 92%;
    object-fit: contain;
    display: block;
    border-radius: 50%;
  }
  #app.state-angry #result-img {
    animation: zoom-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  #app.state-result #result-img {
    animation: prunprun 1.0s ease-in-out infinite;
  }

  /* ===== 怒りのセリフ ===== */
  #speech {
    position: absolute;
    left: 50%;
    top: 12%;
    transform: translateX(-50%) scale(0);
    width: 88%;
    max-width: 420px;
    text-align: center;
    font-size: clamp(26px, 8vw, 44px);
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    text-shadow:
      -3px -3px 0 #d12, 3px -3px 0 #d12,
      -3px  3px 0 #d12, 3px  3px 0 #d12,
       0   -4px 0 #d12, 0    4px 0 #d12,
      -4px  0   0 #d12, 4px  0   0 #d12,
       0 6px 14px rgba(0,0,0,0.45);
    z-index: 110;
    pointer-events: none;
  }
  @keyframes speech-pop {
    0%   { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 0; }
    60%  { transform: translateX(-50%) scale(1.15) rotate(4deg); opacity: 1; }
    80%  { transform: translateX(-50%) scale(0.95) rotate(-2deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes speech-wobble {
    0%,100% { transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%     { transform: translateX(-50%) scale(1.04) rotate(2deg); }
  }
  #app.state-angry #speech {
    animation: speech-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
  }
  #app.state-result #speech {
    transform: translateX(-50%) scale(1);
    opacity: 1;
    animation: speech-wobble 1.0s ease-in-out infinite;
  }

  /* ===== ローディング ===== */
  #loading {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 200;
    transition: opacity 0.3s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .ltext { font-size: 14px; color: rgba(255,255,255,0.75); }
  #loading .ltitle { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="app" class="state-loading">
  <header>
    <button class="hbtn" id="backBtn" aria-label="戻る">&#8592;</button>
    <div class="title">怒る顔</div>
    <button class="hbtn retry-btn" id="retryBtn" aria-label="リトライ">&#10227;</button>
    <div class="hright">
      <button class="noads" id="noAdsBtn">NO ADS</button>
      <button class="hbtn" id="muteBtn" aria-label="ミュート切替">&#128266;</button>
    </div>
  </header>

  <div id="field-wrap">
    <div id="panel">
      <!-- 25セルはJSで生成 -->
      <div id="result-layer">
        <img id="result-img" alt="">
        <div id="speech"></div>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="ltitle">怒る顔</div>
    <div class="spinner"></div>
    <div class="ltext" id="loadText">素材を読み込み中…</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ===== 顔定義（3人） =====
  // normal = 笑っている顔（ふだんの顔）, angry = 怒っている顔
  var FACES = [
    { key: "face1", normal: "faces/face1.png", angry: "faces/face1_angry.png", voice: "sounds/voice_face1.m4a" }, // 原
    { key: "face2", normal: "faces/face2.png", angry: "faces/face2_angry.png", voice: "sounds/voice_face2.m4a" }, // 尚人
    { key: "face3", normal: "faces/face3.png", angry: "faces/face3_angry.png", voice: "sounds/voice_face3.m4a" }  // HIRO
  ];

  // この顔（白髪まじりのおじさん＝face1）をタップすると怒る
  var ANGRY_KEY = "face1";
  var ANGRY_LINE = "おじさんじゃねえだろ！";

  var SOUND_TAP = "sounds/tap.m4a";
  var SOUND_ANGRY = "sounds/angry.m4a";
  var GRID = 25;

  // ===== DOM参照 =====
  var app = document.getElementById("app");
  var panel = document.getElementById("panel");
  var resultLayer = document.getElementById("result-layer");
  var resultImg = document.getElementById("result-img");
  var speech = document.getElementById("speech");
  var loading = document.getElementById("loading");
  var loadText = document.getElementById("loadText");
  var muteBtn = document.getElementById("muteBtn");
  var retryBtn = document.getElementById("retryBtn");

  // ===== 状態（怒る位置はここだけで管理。DOMには出さない） =====
  var state = "loading";          // loading | playing | angry | result
  var cellData = [];              // 各マスの人key
  var cells = [];                 // セル要素
  var remaining = 0;

  // ===== オーディオ（Web Audio API） =====
  var audioCtx = null;
  var buffers = {};
  var muted = false;

  try { muted = localStorage.getItem("okorukao_muted") === "1"; } catch (e) {}

  function updateMuteIcon() {
    muteBtn.innerHTML = muted ? "&#128263;" : "&#128266;";
  }
  updateMuteIcon();

  function ensureAudioCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playSound(url) {
    if (muted || !audioCtx || !buffers[url]) return;
    try {
      var src = audioCtx.createBufferSource();
      src.buffer = buffers[url];
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
  }

  // ===== プリロード =====
  function preloadImage(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(); };
      img.onerror = function () { resolve(); };
      img.src = url;
    });
  }

  function loadSoundBuffer(url) {
    return fetch(url)
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (buf) {
        return new Promise(function (resolve) {
          if (!audioCtx) { resolve(); return; }
          audioCtx.decodeAudioData(buf, function (decoded) {
            buffers[url] = decoded;
            resolve();
          }, function () { resolve(); });
        });
      })
      .catch(function () {});
  }

  function preloadAll() {
    var imgUrls = [];
    FACES.forEach(function (b) { imgUrls.push(b.normal); imgUrls.push(b.angry); });
    var imgPromises = imgUrls.map(preloadImage);

    ensureAudioCtx();
    var sndUrls = [SOUND_TAP, SOUND_ANGRY];
    FACES.forEach(function (b) { if (b.voice) sndUrls.push(b.voice); });
    var sndPromises = sndUrls.map(loadSoundBuffer);

    return Promise.all(imgPromises.concat(sndPromises));
  }

  // ===== 配置ロジック =====
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildLayout() {
    // 3人を最低1マスずつ＋残りをランダム＝25マス
    var picks = FACES.map(function (b) { return b.key; });
    for (var i = 0; i < GRID - FACES.length; i++) {
      picks.push(FACES[Math.floor(Math.random() * FACES.length)].key);
    }
    shuffle(picks);
    cellData = picks;
    // 怒るのは「この顔（ANGRY_KEY）」。どのマスにあっても、タップされたら怒る。
  }

  function faceByKey(key) {
    for (var i = 0; i < FACES.length; i++) {
      if (FACES[i].key === key) return FACES[i];
    }
    return FACES[0];
  }

  // ===== パネルサイズ調整（正方形セル 1:1） =====
  var CELL_RATIO = 1; // 幅/高さ
  function layoutPanel() {
    var wrap = document.getElementById("field-wrap");
    var cs = getComputedStyle(wrap);
    var availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var gap = 6;
    var pad = 6;
    var cols = 5, rows = 5;

    var cellWByWidth = (availW - (cols - 1) * gap - 2 * pad) / cols;
    var cellHByHeight = (availH - (rows - 1) * gap - 2 * pad) / rows;
    var cellWByHeight = cellHByHeight * CELL_RATIO;

    var cellW = Math.min(cellWByWidth, cellWByHeight);
    if (cellW <= 0) cellW = 10;
    var cellH = cellW / CELL_RATIO;

    var panelW = cols * cellW + (cols - 1) * gap + 2 * pad;
    var panelH = rows * cellH + (rows - 1) * gap + 2 * pad;

    panel.style.width = panelW + "px";
    panel.style.height = panelH + "px";
  }

  // ===== グリッド生成 =====
  function buildGrid() {
    cells = [];
    var old = panel.querySelectorAll(".cell");
    old.forEach(function (c) { c.remove(); });

    for (var i = 0; i < GRID; i++) {
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.i = i;

      var img = document.createElement("img");
      img.className = "face";
      // 全マス「笑っている顔（ふだんの顔）」を表示（srcから当たりは分からない）
      img.src = faceByKey(cellData[i]).normal;
      img.alt = "";
      cell.appendChild(img);

      panel.insertBefore(cell, resultLayer);
      cells.push(cell);
    }
    remaining = GRID;
  }

  // ===== タップ処理 =====
  var pressingCell = null;

  function onPointerDown(e) {
    if (state !== "playing") return;
    var cell = e.target.closest ? e.target.closest(".cell") : null;
    if (!cell) return;
    if (cell.classList.contains("empty") || cell.classList.contains("flying")) return;

    ensureAudioCtx();

    pressingCell = cell;
    cell.classList.add("pressing");
  }

  function onPointerUp(e) {
    if (state !== "playing") return;
    if (!pressingCell) return;

    var cell = pressingCell;
    pressingCell = null;
    cell.classList.remove("pressing");

    var endCell = null;
    if (e.target && e.target.closest) endCell = e.target.closest(".cell");
    if (!endCell && e.clientX != null) {
      var el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.closest) endCell = el.closest(".cell");
    }
    if (endCell !== cell) {
      return;
    }

    var i = parseInt(cell.dataset.i, 10);

    if (cellData[i] === ANGRY_KEY) {
      triggerAngry(cell);
    } else {
      triggerSafe(cell);
    }
  }

  function onPointerCancel() {
    if (pressingCell) {
      pressingCell.classList.remove("pressing");
      pressingCell = null;
    }
  }

  // セーフ：その人のボイス→跳ねて飛ぶ→空白
  function triggerSafe(cell) {
    var i = parseInt(cell.dataset.i, 10);
    var face = faceByKey(cellData[i]);
    playSound(face.voice || SOUND_TAP);
    cell.classList.add("flying");
    remaining--;
    setTimeout(function () {
      cell.classList.remove("flying");
      cell.classList.add("empty");
    }, 420);
  }

  // 怒り：溜め→差し替え＋音＋震え→ズーム＋セリフ→結果
  function triggerAngry(cell) {
    state = "angry";
    app.classList.remove("state-playing");
    app.classList.add("state-angry");

    var i = parseInt(cell.dataset.i, 10);
    var face = faceByKey(cellData[i]); // タップされた「この顔」

    setTimeout(function () {
      var img = cell.querySelector(".face");
      img.src = face.angry;
      cell.classList.remove("pressing");
      cell.classList.add("angry", "shaking");

      playSound(face.voice || SOUND_ANGRY);

      cells.forEach(function (c) {
        if (c !== cell) c.classList.add("fade");
      });

      setTimeout(function () {
        resultImg.src = face.angry;
        speech.textContent = ANGRY_LINE; // 「おじさんじゃねえだろ！」
        setTimeout(function () {
          goResult();
        }, 320);
      }, 420);
    }, 200);
  }

  function goResult() {
    state = "result";
    app.classList.remove("state-angry");
    app.classList.add("state-result");
  }

  // ===== リトライ =====
  function retry() {
    state = "playing";
    app.className = "state-playing";
    resultImg.src = "";
    speech.textContent = "";
    buildLayout();
    layoutPanel();
    buildGrid();
  }

  // ===== ミュート =====
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem("okorukao_muted", muted ? "1" : "0"); } catch (e) {}
    updateMuteIcon();
  }

  // ===== イベント登録 =====
  panel.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerCancel);

  panel.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  panel.addEventListener("dragstart", function (e) { e.preventDefault(); });

  muteBtn.addEventListener("click", toggleMute);
  retryBtn.addEventListener("click", function () { if (state === "result") retry(); });

  document.getElementById("backBtn").addEventListener("click", function () {});
  document.getElementById("noAdsBtn").addEventListener("click", function () {});

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      layoutPanel();
    }, 100);
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(layoutPanel, 200);
  });

  // ===== 起動 =====
  var started = false;
  function start() {
    if (started) return;
    started = true;
    preloadAll().then(function () {
      loadText.textContent = "準備完了！";
      buildLayout();
      layoutPanel();
      buildGrid();
      state = "playing";
      app.className = "state-playing";
      loading.classList.add("hidden");
      setTimeout(function () { loading.style.display = "none"; }, 350);
    });
  }

  window.addEventListener("load", start);
  if (document.readyState === "complete") start();
})();
</script>
</body>
</html>
